# Builds ComboBreaker for Windows, Linux, macOS and Android on every push, and
# attaches the packages to a release when one is published on GitHub with a
# tag v*. The packages
# hold the program, a Zig compiler (to build the game's code on the player's
# machine at first launch), SDL2 and the shaders: no game files, no game code.
name: build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Replace the packages of this release (e.g. v1.0) with this build; empty: just build'
        required: false
        default: ''

env:
  ZIG: 0.14.1
  SDL: 2.32.10
  TCC: aade7bafb59641660bc9a0e21ad0a9a4a1ed346e   # TinyCC (mob), for Android

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 libsdl2-dev python3 zip
      - name: SDL2 for MinGW
        run: |
          mkdir -p deps/sdl2-mingw && cd deps/sdl2-mingw
          curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-devel-$SDL-mingw.tar.gz | tar xz
      - name: Build
        run: make -j4 ultracombo windows
      - name: Zig for Windows
        run: |
          curl -sSfL -o zig.zip https://ziglang.org/download/$ZIG/zig-x86_64-windows-$ZIG.zip
          unzip -q zig.zip && mv zig-x86_64-windows-$ZIG zig
      - name: Package
        run: |
          out=ComboBreaker-Windows
          mkdir -p $out/run $out/tools $out/licenses
          cp dist/windows/UltraCombo.exe $out/ComboBreaker.exe
          cp dist/windows/SDL2.dll $out/
          mkdir -p $out/licenses && cp deps/sdl2-mingw/SDL2-$SDL/LICENSE.txt $out/licenses/SDL2-LICENSE.txt 2>/dev/null || true
          cp -r shaders $out/
          cp -r zig $out/tools/zig
          cp README.md $out/
          sh tools/licenses.sh $out/licenses
          cp zig/LICENSE $out/licenses/Zig-LICENSE.txt
          cp tools/run-readme.txt $out/run/PUT-GAME-FILES-HERE.txt
          zip -qr9 ComboBreaker-Windows.zip $out
      - uses: actions/upload-artifact@v4
        with: { name: ComboBreaker-Windows, path: ComboBreaker-Windows.zip }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 cmake patchelf libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl-dev libgl-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: SDL2 (the distribution's is too old)
        run: |
          curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-$SDL.tar.gz | tar xz
          cmake -S SDL2-$SDL -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl-build -j4 && sudo cmake --install sdl-build
      - name: Build
        run: |
          make -j4 ultracombo
          patchelf --set-rpath '$ORIGIN/lib' ultracombo
      - name: Zig for Linux
        run: |
          curl -sSfL https://ziglang.org/download/$ZIG/zig-x86_64-linux-$ZIG.tar.xz | tar xJ
          mv zig-x86_64-linux-$ZIG zig
      - name: Package
        run: |
          out=ComboBreaker-Linux
          mkdir -p $out/run $out/tools $out/licenses
          cp ultracombo $out/combobreaker
          mkdir -p $out/lib && cp -L /usr/local/lib/libSDL2-2.0.so.0 $out/lib/
          cp SDL2-$SDL/LICENSE.txt $out/licenses/SDL2-LICENSE.txt
          cp -r shaders $out/
          cp -r zig $out/tools/zig
          cp README.md $out/
          sh tools/licenses.sh $out/licenses
          cp zig/LICENSE $out/licenses/Zig-LICENSE.txt
          cp tools/run-readme.txt $out/run/PUT-GAME-FILES-HERE.txt
          tar -cJf ComboBreaker-Linux.tar.xz $out
      - uses: actions/upload-artifact@v4
        with: { name: ComboBreaker-Linux, path: ComboBreaker-Linux.tar.xz }

  macos:
    runs-on: macos-latest        # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install sdl2 pkg-config dylibbundler
      - name: Build
        run: make -j4 CC=clang ultracombo
      - name: Zig for macOS
        run: |
          curl -sSfL https://ziglang.org/download/$ZIG/zig-aarch64-macos-$ZIG.tar.xz | tar xJ
          mv zig-aarch64-macos-$ZIG zig
      - name: Package
        run: |
          out=ComboBreaker-macOS
          mkdir -p $out/run $out/tools $out/licenses $out/lib
          cp ultracombo $out/combobreaker
          # carry SDL2 along and point the program at it
          dylibbundler -od -b -x $out/combobreaker -d $out/lib -p @executable_path/lib/
          # Homebrew's sdl2 is sdl2-compat, which loads SDL3 at run time: ship that too
          if [ -e "$(brew --prefix)/lib/libSDL3.0.dylib" ]; then cp -L "$(brew --prefix)/lib/libSDL3.0.dylib" $out/lib/; fi
          ls -la $out/lib
          cp -r shaders $out/
          cp -r zig $out/tools/zig
          cp README.md $out/
          sh tools/licenses.sh $out/licenses
          cp zig/LICENSE $out/licenses/Zig-LICENSE.txt
          cp tools/run-readme.txt $out/run/PUT-GAME-FILES-HERE.txt
          tar -cJf ComboBreaker-macOS.tar.xz $out
      - uses: actions/upload-artifact@v4
        with: { name: ComboBreaker-macOS, path: ComboBreaker-macOS.tar.xz }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev python3
      - name: Desktop program (draws the icon)
        run: make -j4 ultracombo
      - name: SDL2 sources
        run: curl -sSfL https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-$SDL.tar.gz | tar xz
      - name: Prepare
        run: sh tools/android-prepare.sh SDL2-$SDL ./ultracombo
      - name: TinyCC for the phone (builds the game's code there, LGPL, loaded as libtcc.so)
        run: |
          git clone -q https://github.com/TinyCC/tinycc.git && cd tinycc && git checkout -q $TCC
          ./configure >/dev/null && make tccdefs_.h
          bin=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          for t in arm64-v8a:aarch64:ARM64 x86_64:x86_64:X86_64; do
            abi=${t%%:*}; rest=${t#*:}; triple=${rest%%:*}; target=${rest#*:}
            mkdir -p ../android/app/src/main/jniLibs/$abi
            $bin/$triple-linux-android24-clang -shared -fPIC -O2 -w -DONE_SOURCE=1 -DTCC_TARGET_$target=1 \
              -DTARGETOS_ANDROID=1 -DCONFIG_TRIPLET="\"$triple-linux-android\"" -I. libtcc.c \
              -o ../android/app/src/main/jniLibs/$abi/libtcc.so -lm -ldl
          done
          cd .. && sh tools/licenses.sh android/app/src/main/assets/licenses SDL2-$SDL tinycc
      - name: Signing key
        # Only the keystore is secret (ANDROID_KEYSTORE_B64). Its password
        # is not: it would only guard the file, which is already a secret.
        # A key that can't be read gives a warning and the throwaway key.
        env: { KEY: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          pw=7gimyRuWV2blKWinjq535np
          if [ -n "$KEY" ] && echo "$KEY" | tr -d ' \r\n' | base64 -d > $RUNNER_TEMP/release.keystore &&
             keytool -list -keystore $RUNNER_TEMP/release.keystore -storepass "$pw" -alias combobreaker >/dev/null; then
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$pw" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=combobreaker" >> $GITHUB_ENV
            echo "signing with the project's key"
          else
            echo "::warning::no usable signing key (secret ANDROID_KEYSTORE_B64): the APK is signed with a throwaway debug key"
          fi
      - name: Build
        run: |
          ndk=$(sed -n 's/^Pkg.Revision *= *//p' $ANDROID_NDK_HOME/source.properties)
          v=${{ inputs.release_tag || github.ref_name }}
          cd android
          gradle --no-daemon assembleRelease -PndkVersion=$ndk -PversionCode=${{ github.run_number }} -PversionName=${v#v}
          cp app/build/outputs/apk/release/app-release.apk ../ComboBreaker-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: ComboBreaker-Android, path: ComboBreaker-Android.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            ComboBreaker-Windows.zip
            ComboBreaker-Linux.tar.xz
            ComboBreaker-macOS.tar.xz
            ComboBreaker-Android.apk
