// ComboBreaker for Android: SDL2 and the program built by CMake into
// libSDL2.so and libmain.so (jni/CMakeLists.txt). The SDL sources (C and
// Java) are put in place by tools/android-prepare.sh before building.
apply plugin: 'com.android.application'

android {
    namespace 'io.github.vito2492.combobreaker'
    compileSdk 34
    if (project.hasProperty('ndkVersion')) ndkVersion project.property('ndkVersion')
    defaultConfig {
        applicationId 'io.github.vito2492.combobreaker'
        minSdk 24
        targetSdk 34
        versionCode (project.findProperty('versionCode') ?: '1') as int
        versionName project.findProperty('versionName') ?: '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    signingConfigs {
        // a key from the environment (CI secrets) when there is one
        release {
            def ks = System.getenv('ANDROID_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
}
